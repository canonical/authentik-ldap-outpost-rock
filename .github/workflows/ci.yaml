name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release-**"
    tags:
      - "v**"
    paths:
      - "rockcraft.yaml"
      - ".trivyignore"
      - ".github/workflows/**.yaml"
  pull_request:
    branches:
      - "*"

jobs:
  get-architectures:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.parse.outputs.architectures }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse platforms from rockcraft.yaml
        id: parse
        run: |
          archs=$(yq -o=json -I=0 '.platforms | keys' rockcraft.yaml)
          echo "Found architectures: $archs"
          echo "architectures=$archs" >> "$GITHUB_OUTPUT"

  build:
    needs: get-architectures
    strategy:
      matrix:
        architecture: ${{ fromJson(needs.get-architectures.outputs.architectures) }}
    uses: canonical/identity-team/.github/workflows/_rock-build.yaml@e710e7f451e62c37e7038d45b6c3bfa7dbfb28c0 # v1.20.0
    with:
      structure-tests-enabled: true
      architecture: ${{ matrix.architecture }}

  gh-publish:
    uses: canonical/identity-team/.github/workflows/_rock-gh-publish-third-party.yaml@e710e7f451e62c37e7038d45b6c3bfa7dbfb28c0 # v1.20.0
    permissions:
      packages: write
      contents: read
    if: ${{ (github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/heads/release-') || (github.ref_type == 'tag') }}
    needs: build
    with:
      candidate: true
  oci-publish:
    # only release to oci-factory in case of release
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [build, promote]
    uses: canonical/identity-team/.github/workflows/_rock-oci-publish.yaml@e710e7f451e62c37e7038d45b6c3bfa7dbfb28c0 # v1.20.0
    with:
      edge-release: false
      eol-stable-release: "3 month"
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  scan:
    permissions:
      packages: read
      contents: read
      security-events: write
      actions: read
    if: ${{ (github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/heads/release-') || (github.ref_type == 'tag') }}
    needs: gh-publish
    uses: canonical/identity-team/.github/workflows/_rock-scan.yaml@e710e7f451e62c37e7038d45b6c3bfa7dbfb28c0 # v1.20.0
    with:
      image: ${{ needs.gh-publish.outputs.image }}
      exit-code: '1'
      severity: 'HIGH,CRITICAL'
      ignore-unfixed: true
      trivyignores: '.trivyignore'

  promote:
    if: ${{ (github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/heads/release-') || (github.ref_type == 'tag') }}
    needs: [gh-publish, scan]
    permissions:
      packages: write
      contents: write
    uses: canonical/identity-team/.github/workflows/_rock-promote.yaml@e710e7f451e62c37e7038d45b6c3bfa7dbfb28c0 # v1.20.0
    with:
      candidate-image: ${{ needs.gh-publish.outputs.image }}
      release-tag: ${{ needs.gh-publish.outputs.version }}
      target-repository: ${{ github.repository_owner }}/${{ needs.gh-publish.outputs.image-name }}
      promote-stable: true
      promote-latest: true
      mark-latest: false

  oci-update-pr:
    permissions:
      contents: write
      pull-requests: write
    needs: [promote]
    if: github.ref_type == 'tag'
    uses: canonical/identity-team/.github/workflows/oci-update-pr.yaml@e710e7f451e62c37e7038d45b6c3bfa7dbfb28c0 # v1.20.0
    with:
        oci-image: ${{ needs.promote.outputs.image }}
        repository: canonical/authentik-ldap-outpost-operator
    secrets:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
